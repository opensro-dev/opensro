// The fortress-war blocks of the retail shard's schedule.cfg (SR_ShardManager),
// values unchanged. Weekdays count from 0 = Sunday; times are shard local.

// Guilds may apply for the coming war Monday to Friday.
Schedule AllowSiegeRequest
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Weekly		1, { 1, 2, 3, 4, 5, }
	Once		00:00:00, 23:59:59
}

// The war itself, every Wednesday.
Schedule SiegeProgressing
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Weekly		1, {3, }
	Once		20:00:00, 21:30:00
}

// The daily fortress status update.
Schedule FortressStatusUpdate
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Daily		1,1
	Once		23:05:00, 23:06:00
}

// Tax may be collected on war day.
Schedule AllowSiegeTaxJob
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Weekly		1, {3, }
	Once		00:00:00, 23:59:59
}

