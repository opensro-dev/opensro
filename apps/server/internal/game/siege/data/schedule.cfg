// The fortress-war blocks of schedule.cfg (SR_ShardManager). Weekdays count
// from 0 = Sunday; times are shard local.
//
// The v1.150 client fixes the week: its application window
// (CIFFortress_FormatWarDateText 660C70) prints only the war's start and
// derives the rest from it, the war as start to start + 2 hours and the
// application period as the dates of start - 3 days to start - 1 day. The
// blocks here are that week around a Wednesday 20:00 war, so every date the
// window prints is a date the server accepts. The server references differ
// and are not used: the reference server modules' copy applies Monday to
// Friday for a 20:00-21:30 Wednesday war (the window then printed Sunday,
// which it refused), ISRO-R every second week for a Saturday war.

// Guilds may apply for the coming war Sunday to Tuesday.
Schedule AllowSiegeRequest
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Weekly		1, { 0, 1, 2, }
	Once		00:00:00, 23:59:59
}

// The war itself, every Wednesday, for the client's two hours.
Schedule SiegeProgressing
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Weekly		1, {3, }
	Once		20:00:00, 22:00:00
}

// The daily fortress status update.
Schedule FortressStatusUpdate
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Daily		1,1
	Once		23:05:00, 23:06:00
}

// Tax may be collected on war day.
Schedule AllowSiegeTaxJob
{
	DurationBegin	2006-12-13, 00:00:00
	DurationEnd	2030-12-31, 00:00:00
	Weekly		1, {3, }
	Once		00:00:00, 23:59:59
}

