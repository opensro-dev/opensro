# nginx.conf - the edge in front of the OpenSRO stack
#
# Traefik terminates TLS and forwards here. Routes follow
# apps/client-next/docs/HOSTING.md: /api/ goes to the Agent without the
# prefix, each shard's /shards/<id>/transport/ goes to its GameWorld as a
# WebSocket. Upstreams are resolved per request through Docker's DNS, so
# nginx starts (and `nginx -t` passes) before the server containers exist.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agent http://agent:8787;
    set $gameworld_global_official http://gameworld-global-official:8788;
    set $gameworld_pvp http://gameworld-pvp:8788;

    gzip_static on;
    # Text only. Packs are application/octet-stream and must stay raw: their
    # members are compressed inside the pack (SROPACK2), and a Range over an
    # encoded body would cut the compressed bytes (ASSET_DELIVERY.md).
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $agent;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /shards/global-official/transport/ {
        rewrite ^/shards/global-official(/transport/.*)$ $1 break;
        proxy_pass $gameworld_global_official;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /shards/pvp/transport/ {
        rewrite ^/shards/pvp(/transport/.*)$ $1 break;
        proxy_pass $gameworld_pvp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Packs are content-addressed (<group>-NNN-<hash>.bin): never refetched.
    location ~ ^/assets/packs/.+\.bin$ {
        root /srv/game;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifests and the delivery lists change in place on a data release.
    location ~ ^/assets/(manifest\.json|packs/manifest\.json|delivery/) {
        root /srv/game;
        add_header Cache-Control "no-cache";
    }

    # The built bundles (dist/assets/<name>-<hash>.js) first, then the game
    # release rollout.sh mounts at /srv/game (its own assets/ tree).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @game;
    }

    location @game {
        root /srv/game;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # /play is the live page the release watch reads (runtime.ts RELEASE_PAGE).
    location = /play {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
