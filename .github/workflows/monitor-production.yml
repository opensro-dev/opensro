# ===========================================================================
# monitor-production.yml - observe the HTTPS edge from outside the game host.
# Durable transition state prevents repeated alerts and preserves failed
# deliveries. The host timer handles game-process failures at a faster cadence.
# ===========================================================================
name: Monitor production edge

on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: production-edge-monitor
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: monitoring
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore durable observation state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/edge"
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts | map(select(.name == "edge-monitor-state" and .expired == false)) | first | .workflow_run.id // empty')
          if [ -n "$previous" ]; then
            gh run download "$previous" --name edge-monitor-state --dir "$RUNNER_TEMP/edge"
          fi
      - name: Check edge and host heartbeat
        env:
          MONITOR_WEBHOOK: ${{ secrets.MONITOR_WEBHOOK }}
        run: python3 apps/server/ops/release/monitor.py --edge-workflow "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-monitor-state
          path: ${{ runner.temp }}/edge/state.json
          retention-days: 7
          if-no-files-found: error
