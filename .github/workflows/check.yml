# ===========================================================================
# check.yml - validate portable source on Windows without retail game assets.
# The committed lockfile owns both pnpm itself and application dependencies;
# installation must not quietly repair either part before the source gates run.
# The Go gate runs once, on Linux (source-linux.yml): this job runs every
# other source gate, and only for a change outside the Go server - a pull
# request that touches apps/server alone has nothing here to check. A push
# to main always runs.
# ===========================================================================
name: source-check

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same pull request supersedes the running check.
concurrency:
  group: source-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The source gates only read the checkout; the change list reads the PR.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      portable: ${{ steps.diff.outputs.portable }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then echo "portable=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '^apps/server/'; then
            echo "portable=true" >> "$GITHUB_OUTPUT"
          else
            echo "portable=false" >> "$GITHUB_OUTPUT"
          fi

  source-check:
    needs: changes
    if: needs.changes.outputs.portable == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The standalone pnpm the packageManager field in package.json names (the
      # one place its version is pinned). pnpm/action-setup bootstraps through
      # npm and switches versions, which a frozen pnpm 12 install rejects.
      - uses: pnpm/setup@v3
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # check:client-preparation reads synthetic PK2 archives (pycryptodome).
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Require dependency inputs to remain unchanged
        run: git diff --exit-code HEAD -- pnpm-lock.yaml pnpm-workspace.yaml package.json ':(glob)apps/*/package.json'
      - run: pnpm check source-portable

  # The asset pipeline and asset-dependent suites consume a locally extracted,
  # licensed v1.150 client and are intentionally not run on hosted machines.
