# ===========================================================================
# source-linux.yml - prove release inputs on a clean Linux checkout.
# These checks need no extracted game data or deployment credentials. Asset
# verification remains in the full client check on a licensed asset workspace.
# The full Go gate (check_go_server.mjs) runs here, once: Linux runners build
# and restore the Go cache several times faster than Windows ones, and a
# GOOS=windows vet keeps the operator tools building for Windows. A pull
# request runs only the jobs its files can affect; a push to main runs all.
# ===========================================================================
name: Validate Linux source

on:
  pull_request:
  push:
    branches: [ main ]

# A newer push to the same pull request supersedes the running validation.
concurrency:
  group: source-linux-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.diff.outputs.client }}
      server: ${{ steps.diff.outputs.server }}
      shardsettings: ${{ steps.diff.outputs.shardsettings }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then printf 'client=true\nserver=true\nshardsettings=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          # Shared inputs (workflows, lockfile, task runner) affect both sides.
          shared='^(\.github/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|scripts/tasks/)'
          match() { printf '%s\n' "$files" | grep -qE "$1|$shared" && echo true || echo false; }
          echo "client=$(match '^(apps/client-next/|packages/)')" >> "$GITHUB_OUTPUT"
          # The Go gate also reads the pipeline paths and its own scripts.
          echo "server=$(match '^(apps/server/|scripts/checks/(check_go_server|checkStamps)\.mjs|scripts/build/world/paths\.mjs)')" >> "$GITHUB_OUTPUT"
          # The shard-settings table against the private ops repo's job.
          echo "shardsettings=$(match '^apps/server/internal/config/shardsettings/')" >> "$GITHUB_OUTPUT"

  client-source:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: Require dependency inputs to remain unchanged
        run: git diff --exit-code HEAD -- pnpm-lock.yaml pnpm-workspace.yaml package.json ':(glob)apps/*/package.json'
      - name: Verify client without generated retail assets
        # The tight test budgets bind where the profile was measured
        # (docs/agents/client-test-profile.md); the runner's defaults
        # stay loose for the unmeasured full lane (#2929).
        env:
          SRO_TEST_FILE_BUDGET_MS: "20000"
          SRO_TEST_SUITE_BUDGET_MS: "300000"
        run: node apps/client-next/tools/check.mjs --source

  # The repository source policies that cover server files too. source-check
  # (check.yml) skips a server-only pull request, so without this job such a
  # pull request ran none of them (#881 merged a file past the size limit).
  # Each gate needs only Node and the runner's Python, no node_modules. A mixed pull
  # request also runs them in source-check; this job does not depend on that
  # workflow's file filter, at the cost of a minute.
  server-policy:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # One step per gate (the task runner takes one task), each run even
      # after an earlier one fails so a pull request sees every problem.
      - name: Source size
        run: node scripts/task.mjs check:source-size
      - name: Source encoding
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:source-encoding
      - name: Generated root
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:generated-root
      - name: Shared fixtures
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:shared-fixtures
      # The whole-tree citation ledger: a server-only change that moves a
      # ledgered line into another file must fail here, since source-check
      # skips server-only pull requests.
      - name: Server citations
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:server-citations
      # The plane owner (#1646): on the server only simulation and movement
      # plane.go may read the dungeon region bit; #1906 slipped one past.
      - name: Plane branches
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:plane-branches
      # Both check generated server outputs against their sources: the
      # compiled quest package (internal/game/quest) and the loot catalogs
      # (internal/game/item/loot/.generated). Standard-library Python only.
      - name: Compiled quests
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:compiled-quests
      - name: Loot catalog
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:loot-catalog
      # The client's pet design module against the server's design JSON.
      - name: Pet design
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:pet-design
      # The client protocol against config/compatibility.json, the release
      # declaration the server ships.
      - name: Release
        if: ${{ !cancelled() }}
        run: node scripts/task.mjs check:release

  server-source:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Every Go command of the job compiles with -trimpath, as the gate's
      # own steps do (scripts/lib/goEnvironment.mjs): one build-cache key.
      GOFLAGS: -trimpath
    # The Go gate spread over four runners: on one 4-core runner its steps
    # fought for the CPU (race 271 s). Each shard gets the whole machine.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: static, gates: "tidy,tidy (lint tool),gofmt,vet,govulncheck,release contract" }
          - { name: lint, gates: "golangci-lint" }
          - { name: tests, gates: "tests" }
          - { name: race, gates: "race" }
    name: server-source (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          # The build, test and lint caches below are keyed per commit;
          # setup-go's go.sum-only key never saved a newer cache.
          cache: false
      - name: Go build, test and lint caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          # Each run saves under its commit and restores the newest cache of
          # the same shard and go.sum: unchanged packages keep their cached
          # test results and compiled objects.
          key: go-${{ matrix.shard.name }}-${{ hashFiles('apps/server/go.sum', 'apps/server/tools/golangci-lint/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ matrix.shard.name }}-${{ hashFiles('apps/server/go.sum', 'apps/server/tools/golangci-lint/go.sum') }}-
      - name: Go server gate (${{ matrix.shard.gates }})
        env:
          SRO_GO_GATES: ${{ matrix.shard.gates }}
        run: node scripts/checks/check_go_server.mjs
      - name: Repeated handshake accounting
        if: matrix.shard.name == 'race'
        working-directory: apps/server
        run: go test -race -count=100 -run '^TestTransportMetricsEndpoint$' ./internal/transport
      - name: Windows build of the server and its operator tools
        if: matrix.shard.name == 'static'
        working-directory: apps/server
        env:
          GOOS: windows
          CGO_ENABLED: "0"
        run: go vet ./...

  # The shard-settings table against the private ops repo's GameWorld
  # job. These tests skip in a plain checkout (opstree.Require: no ops
  # tree beside the code), so until now only the release build ran them,
  # and on 2026-11-10 it found the pair drifted in both directions
  # (opensro-ops#242). A pull request that touches the table checks out
  # opensro-ops at main, lays its server-ops/ into apps/server/ops as
  # the release build does, and fails until the job there matches:
  # land the ops change first, then this goes green. The ops repo runs
  # the same two packages on its own pull requests and nightly.
  # The checkout needs OPS_TREE_READ_TOKEN, a read-only credential for
  # opensro-ops; fork pull requests do not receive it and cannot pass
  # this job (the ops repo's nightly run is their backstop).
  server-job-contract:
    needs: changes
    if: needs.changes.outputs.shardsettings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # As server-source: every Go command compiles with -trimpath.
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: opensro-dev/opensro-ops
          ref: main
          path: ops-tree
          token: ${{ secrets.OPS_TREE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Lay the ops tree into the module, as the release build does
        run: |
          rm -rf apps/server/ops
          mkdir -p apps/server/ops
          cp -a ops-tree/server-ops/. apps/server/ops/
          cp apps/server/config/compatibility.json apps/server/config/shard-settings.json apps/server/ops/release/
          test -f apps/server/ops/nomad/jobs/gameworld.nomad.hcl
      - name: Check the job contract (setting table, job file, deployment tool)
        working-directory: apps/server
        run: go test -count=1 ./internal/config/shardsettings ./cmd/operations/sro-nomad

  # The one check from this workflow a ruleset can require (a job skipped by
  # `if:` satisfies a required check). It always runs and fails when a job
  # failed, or was skipped although this pull request's files needed it.
  gate-summary:
    name: gate-summary (linux)
    needs: [changes, client-source, server-policy, server-source, server-job-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Linux gate this change needs passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CLIENT: ${{ needs.changes.outputs.client }}
          SERVER: ${{ needs.changes.outputs.server }}
          SHARDSETTINGS: ${{ needs.changes.outputs.shardsettings }}
          CLIENT_SOURCE: ${{ needs.client-source.result }}
          SERVER_POLICY: ${{ needs.server-policy.result }}
          SERVER_SOURCE: ${{ needs.server-source.result }}
          JOB_CONTRACT: ${{ needs.server-job-contract.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "changes: $CHANGES"; exit 1; }
          failed=0
          # need NAME RESULT NEEDED: success passes, a skip passes only when
          # the change did not need the job, anything else fails.
          need() {
            case "$2" in
              success) echo "$1: success" ;;
              skipped) if [ "$3" = true ]; then echo "$1 was skipped although this change needs it"; failed=1; else echo "$1: not needed"; fi ;;
              *) echo "$1: $2"; failed=1 ;;
            esac
          }
          need client-source "$CLIENT_SOURCE" "$CLIENT"
          need server-policy "$SERVER_POLICY" "$SERVER"
          need server-source "$SERVER_SOURCE" "$SERVER"
          need server-job-contract "$JOB_CONTRACT" "$SHARDSETTINGS"
          exit $failed
