# ===========================================================================
# release-server.yml - stage tested server bytes before production approval.
# New builds may supersede older builds; approved rollouts are never cancelled.
# ===========================================================================
name: Release game server

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-server.yml
      - apps/server/ops/release/**
      - apps/server/cmd/operations/sro-nomad/**
  push:
    branches: [main]
    paths:
      - apps/server/**
      - .github/workflows/release-server.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request' && 'release-validation' || 'release-staging' }}
    concurrency:
      group: server-build-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
      cancel-in-progress: true
    outputs:
      candidate: ${{ steps.stage.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        if: github.event_name != 'pull_request'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Test Linux server and release boundary
        working-directory: apps/server
        run: |
          go test -p 2 ./...
          python3 -m unittest discover -s ops/release -p 'test_*.py'
          go run ./cmd/operations/sro-release-contract | python3 ops/release/verify_contract.py
      - name: Build static binaries
        working-directory: apps/server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p bin
          go build -trimpath -o bin/agent ./cmd/services/sro-agent
          go build -trimpath -o bin/gameworld ./cmd/services/sro-gameworld
          go build -trimpath -o bin/sro-nomad ./cmd/operations/sro-nomad
          go build -trimpath -o bin/sro-provision-identity ./cmd/operations/sro-provision-identity
      - name: Bind artifact to current production
        if: github.event_name != 'pull_request'
        run: |
          python3 apps/server/ops/release/plan.py server --check-commit "$GITHUB_SHA"
          curl --fail --silent --show-error https://opensro.online/releases/production.json -o "$RUNNER_TEMP/production.json"
          python3 apps/server/ops/release/bundle.py "$RUNNER_TEMP/server.tar" "$RUNNER_TEMP/production.json"
          sha256sum "$RUNNER_TEMP/server.tar" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage verified server
        id: stage
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_STAGE_KEY }}
          RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
        run: python3 apps/server/ops/release/ci.py stage server "$RUNNER_TEMP/server.tar"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: server-${{ github.sha }}
          path: |
            ${{ runner.temp }}/server.tar
            candidate.json
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Describe approval
        if: github.event_name != 'pull_request'
        run: |
          echo 'Server update: restarts game services after an in-game notice. Client stays unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Approve only the latest ready server candidate: https://opensro.online/releases/' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-publication
      cancel-in-progress: false
    environment:
      name: production
      url: https://opensro.online/releases/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish the approved candidate
        env:
          RELEASE_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          RELEASE_HOST: ${{ secrets.SERVER_DEPLOY_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.SERVER_DEPLOY_KNOWN_HOSTS }}
          CANDIDATE: ${{ needs.build.outputs.candidate }}
        run: |
          python3 apps/server/ops/release/ci.py publish server "$CANDIDATE"
