# ===========================================================================
# rollback-production.yml - approve retained production bytes against live state.
# Rollback is explicit and component-specific. Database restores are excluded;
# incompatible schema or protocol declarations fail before approval is offered.
# ===========================================================================
name: Roll back a production component

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to restore
        type: choice
        options: [client, server]
        required: true
      release:
        description: Full release identity from production history
        type: string
        required: true
      reason:
        description: Reason for restoring this release
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-staging
    outputs:
      candidate: ${{ steps.prepare.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Prepare retained artifact
        id: prepare
        env:
          COMPONENT: ${{ inputs.component }}
          RELEASE: ${{ inputs.release }}
          REASON: ${{ inputs.reason }}
          RELEASE_KEY: ${{ secrets.RELEASE_STAGE_KEY }}
          RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
        run: python3 apps/server/ops/release/ci.py rollback "$COMPONENT" "$RELEASE" --reason "$REASON"
      - uses: actions/setup-node@v6
        if: inputs.component == 'client'
        with:
          node-version: 24
      - name: Recheck the retained browser against the current server
        if: inputs.component == 'client'
        env:
          RELEASE_PROBE_ACCOUNT: ${{ secrets.RELEASE_PROBE_ACCOUNT }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node apps/client-next/tools/beta/release-smoke.mjs candidate.json "$RUNNER_TEMP/browser"
      - name: Record browser evidence
        if: inputs.component == 'client'
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_STAGE_KEY }}
          RELEASE_HOST: ${{ secrets.RELEASE_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.RELEASE_KNOWN_HOSTS }}
        run: python3 apps/server/ops/release/ci.py evidence client "$RUNNER_TEMP/browser/report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rollback-${{ github.run_id }}
          path: |
            candidate.json
            ${{ runner.temp }}/browser
          retention-days: 30

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-publication
      cancel-in-progress: false
    environment:
      name: production
      url: https://opensro.online/releases/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply the approved rollback
        env:
          COMPONENT: ${{ inputs.component }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          RELEASE_KEY: ${{ secrets.SERVER_DEPLOY_KEY }}
          RELEASE_HOST: ${{ secrets.SERVER_DEPLOY_HOST }}
          RELEASE_KNOWN_HOSTS: ${{ secrets.SERVER_DEPLOY_KNOWN_HOSTS }}
        run: |
          python3 apps/server/ops/release/ci.py publish "$COMPONENT" "$CANDIDATE"
